name: CI

on:
  push:
    branches: [v2, master]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Targets net8.0, but Avalonia 12's analyzers need a current Roslyn, so build with the latest SDK.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ionic reference (npm)
        run: npm ci

      - name: API tool sanity
        run: node tools/ionic-api.js ion-item > /dev/null

      - name: Restore
        run: dotnet restore Avonic.sln

      - name: Build
        run: dotnet build Avonic.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Avonic.sln --no-build --configuration Release --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
