<!doctype html>
<html mode="md"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/node_modules/@ionic/core/css/ionic.bundle.css">
<script>window.Ionic = { config: { mode: 'md' } };</script>
<script type="module" src="/node_modules/@ionic/core/dist/ionic/ionic.esm.js"></script>
<style>html,body{margin:0;height:100%;background:var(--ion-background-color,#fff)}</style>
</head><body><div id="stage"><ion-app style="position:static;display:block;contain:none;overflow:visible"><div style="padding:16px;display:flex;flex-direction:column;gap:16px"><div style="display:flex;gap:12px"><ion-spinner name="bubbles"></ion-spinner><ion-spinner name="circles"></ion-spinner><ion-spinner name="circular"></ion-spinner><ion-spinner name="crescent"></ion-spinner><ion-spinner name="dots"></ion-spinner><ion-spinner name="lines"></ion-spinner><ion-spinner name="lines-small"></ion-spinner><ion-spinner name="lines-sharp"></ion-spinner><ion-spinner name="lines-sharp-small"></ion-spinner></div><div style="display:flex;gap:12px"><ion-spinner></ion-spinner><ion-spinner color="danger" name="crescent"></ion-spinner><ion-spinner color="primary" name="lines"></ion-spinner><ion-spinner color="success" name="dots"></ion-spinner></div><div style="display:flex;gap:12px"><ion-spinner style="width:80px;height:80px"></ion-spinner><ion-spinner name="lines" style="width:80px;height:80px"></ion-spinner><ion-spinner name="crescent" style="width:80px;height:80px"></ion-spinner><ion-spinner name="dots" style="width:80px;height:80px"></ion-spinner></div></div></ion-app><script>customElements.whenDefined("ion-spinner").then(async()=>{const all=[...document.querySelectorAll("ion-spinner")];for(const e of all)await e.componentOnReady();requestAnimationFrame(()=>{for(const e of all)for(const a of e.shadowRoot.getAnimations()){a.pause();a.currentTime=350}})})</script></div></body></html>
